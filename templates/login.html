<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TravelWorld</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(0, 119, 182, 0.75),
                    rgba(2, 62, 138, 0.75)
                ),
                url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e")
                center/cover;
        }

        .login-box {
            width: 420px;
            max-width: 90%;

            background: rgba(255, 255, 255, 0.97);

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #023e8a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #0077b6;
            box-shadow: 0 0 5px rgba(0, 119, 182, 0.2);
        }

        button {
            width: 100%;

            padding: 13px;

            background: #0077b6;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #023e8a;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .register-link a {
            color: #0077b6;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #555;

            text-decoration: none;

            font-size: 14px;
        }

        .home-link:hover {
            color: #0077b6;
        }

    </style>

</head>


<body>


<div class="login-box">

    <div class="logo">
        🌍
    </div>

    <h1>Welcome Back!</h1>

    <p class="subtitle">
        Login to TravelWorld
    </p>


    <form method="POST" action="/login">


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login ✈️
        </button>

    </form>


    <div class="register-link">

        Don't have an account?

        <a href="/register">
            Create Account
        </a>

    </div>


    <a href="/" class="home-link">
        ← Back to Home
    </a>

</div>


</body>

</html>
